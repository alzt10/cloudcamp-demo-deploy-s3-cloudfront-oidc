Transform: AWS::Serverless-2016-10-31
Parameters:
  AdminEmail:
    Type: String
    Description: Correo que recibe la notificacion cuando se elimina un usuario
    Default: alzate901@gmail.com
  SenderEmail:
    Type: String
    Description: Correo verificado en SES usado como remitente de las notificaciones
    Default: alzate901@gmail.com
  SesIdentityDomain:
    Type: String
    Description: Identidad de correo verificada en SES usada para autorizar el envio
    Default: alzate901@gmail.com
Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: Api
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /users:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUsers.Arn}/invocations
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateUser.Arn}/invocations
              responses: {}
            put:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateUser.Arn}/invocations
              responses: {}
            delete:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteUser.Arn}/invocations
              responses: {}
          /users/{id}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserById.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowOrigin: '''*'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        MaxAge: 5
  CreateUser:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: CreateUser
      CodeUri: src/CreateUser
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          USERSTABLE_TABLE_NAME: !Ref UsersTable
          USERSTABLE_TABLE_ARN: !GetAtt UsersTable.Arn
          USERSTOPIC_TOPIC_NAME: !GetAtt UsersTopic.TopicName
          USERSTOPIC_TOPIC_ARN: !Ref UsersTopic
      Events:
        ApiPOSTusers:
          Type: Api
          Properties:
            Path: /users
            Method: POST
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt UsersTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - sns:Subscribe
              Resource: !Ref UsersTopic
  CreateUserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateUser}
  UpdateUser:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: UpdateUser
      CodeUri: src/UpdateUser
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          USERSTABLE_TABLE_NAME: !Ref UsersTable
          USERSTABLE_TABLE_ARN: !GetAtt UsersTable.Arn
          USERSTOPIC_TOPIC_NAME: !GetAtt UsersTopic.TopicName
          USERSTOPIC_TOPIC_ARN: !Ref UsersTopic
      Events:
        ApiPUTusers:
          Type: Api
          Properties:
            Path: /users
            Method: PUT
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt UsersTopic.TopicName
  UpdateUserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateUser}
  GetUsers:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetUsers
      CodeUri: src/GetUsers
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          USERSTABLE_TABLE_NAME: !Ref UsersTable
          USERSTABLE_TABLE_ARN: !GetAtt UsersTable.Arn
      Events:
        ApiGETusers:
          Type: Api
          Properties:
            Path: /users
            Method: GET
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
  GetUsersLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetUsers}
  GetUserById:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetUserById
      CodeUri: src/GetUserById
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          USERSTABLE_TABLE_NAME: !Ref UsersTable
          USERSTABLE_TABLE_ARN: !GetAtt UsersTable.Arn
      Events:
        ApiGETusersid:
          Type: Api
          Properties:
            Path: /users/{id}
            Method: GET
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
  GetUserByIdLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetUserById}
  DeleteUser:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: DeleteUser
      CodeUri: src/DeleteUser
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          USERSTABLE_TABLE_NAME: !Ref UsersTable
          USERSTABLE_TABLE_ARN: !GetAtt UsersTable.Arn
          DELETEUSERSQUEUE_QUEUE_NAME: !GetAtt DeleteUsersQueue.QueueName
          DELETEUSERSQUEUE_QUEUE_ARN: !GetAtt DeleteUsersQueue.Arn
          DELETEUSERSQUEUE_QUEUE_URL: !Ref DeleteUsersQueue
      Events:
        ApiDELETEusers:
          Type: Api
          Properties:
            Path: /users
            Method: DELETE
            RestApiId: !Ref Api
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeleteUsersQueue.QueueName
  DeleteUserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DeleteUser}
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  UsersTopic:
    Type: AWS::SNS::Topic
  NotifyAdmin:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: NotifyAdmin
      CodeUri: src/NotifyAdmin
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Architectures:
        - arm64
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          SENDER_EMAIL: !Ref SenderEmail
      Events:
        DeleteUsersQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt DeleteUsersQueue.Arn
            BatchSize: 1
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityDomain}
  NotifyAdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${NotifyAdmin}
  DeleteUsersQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
Outputs:
  ApiUrl:
    Description: URL base de la API de usuarios
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod
  UsersTableName:
    Description: Nombre de la tabla DynamoDB de usuarios
    Value: !Ref UsersTable